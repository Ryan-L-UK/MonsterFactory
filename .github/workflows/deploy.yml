name: Build and Push Docker Image (Commit-Based Version)

on:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Extract version from commit message
        id: version
        run: |
          msg="${{ github.event.head_commit.message }}"
          # Extract something like v0.1.6 from the commit message
          if [[ "$msg" =~ v([0-9]+\.[0-9]+\.[0-9]+) ]]; then
            echo "VERSION=v${BASH_REMATCH[1]}" >> $GITHUB_ENV
          else
            echo "No version found in commit message"
            exit 1
          fi

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            ghcr.io/ryan-l-uk/monsterfactory:${{ env.VERSION }}
            ghcr.io/ryan-l-uk/monsterfactory:latest
