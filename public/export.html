<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MonsterFactory Export</title>

    <!-- Preload -->
    <link rel="preload" href="/UI/Styles/FontPackages.css" as="style" />
    <!-- Stylesheets -->
    <link rel="stylesheet" href="/UI/Styles/main.css" />

    <!-- Optional: load your global styles (if you want consistent look) -->
    <!-- <link rel="stylesheet" href="/UI/Styles/AppStyles.css" /> -->

    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #05070b;
        color: #f5f1e5;
        font-family: CinzelDecorative, system-ui, -apple-system,
          BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .export-shell {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 16px;
        box-sizing: border-box;
      }

      .export-header {
        width: 100%;
        max-width: 820px;
        display: grid;
        grid-template-columns: 90px 1fr;
        gap: 16px;
        align-items: start;
        margin-bottom: 16px;
      }
      .export-logo-column {
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .export-logo {
        width: 70px;
        height: auto;
        object-fit: contain;
        opacity: 0.95;
      }

      .export-title {
        font-size: 1rem;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        opacity: 0.9;
      }

      .export-actions {
        display: flex;
        gap: 8px;
        margin-top: 4px;
      }

      .export-btn {
        border: 1px solid #d6ae4a;
        background: #12151d;
        color: #f5f1e5;
        padding: 6px 12px;
        font-size: 0.8rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        cursor: pointer;
        border-radius: 4px;
      }

      .export-btn:hover {
        background: #1b2230;
      }

      .export-status {
        width: 100%;
        max-width: 820px;
        font-size: 0.85rem;
        margin-bottom: 8px;
        opacity: 0.85;
      }

      .export-image-wrapper {
        width: 100%;
        max-width: 820px;
        display: flex;
        justify-content: center;
        align-items: center;
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: radial-gradient(circle at top, #131824 0%, #05070b 65%);
        padding: 12px;
        box-sizing: border-box;
      }

      .export-image-wrapper img {
        max-width: 100%;
        height: auto;
        display: block;
      }
    </style>
  </head>

  <body>
    <div class="export-shell">
      <div class="export-header">
        <div class="export-logo-column">
          <img
            src="mf-core-logo.png"
            alt="MonsterFactory Logo"
            class="export-logo"
          />
        </div>

        <div class="export-header-content">
          <div class="export-title">MonsterFactory Export Preview</div>

          <div class="export-status" id="mfExportStatus">
            Waiting for image data…
          </div>

          <div class="export-actions">
            <button class="export-btn" id="mfExportSaveBtn">Save Image</button>
            <button class="export-btn" id="mfExportCloseBtn">Close</button>
          </div>
        </div>
      </div>

      <div class="export-image-wrapper">
        <div id="mfExportImagePlaceholder">Preparing image…</div>
      </div>
    </div>

    <script>
      // Listen for the PNG sent from the main app
      window.addEventListener("message", (event) => {
        if (!event.data || event.data.type !== "mf-export-image") return;

        const dataUrl = event.data.dataUrl;
        const name = event.data.filename || "Creature";

        const placeholder = document.getElementById("mfExportImagePlaceholder");
        const statusEl = document.getElementById("mfExportStatus");
        const saveBtn = document.getElementById("mfExportSaveBtn");

        // Replace placeholder with image
        const img = document.createElement("img");
        img.src = dataUrl;
        img.alt = "Exported creature card";
        placeholder.replaceWith(img);

        statusEl.textContent = `Previewing: ${name}.png`;

        // Save button (mobile-safe)
        saveBtn.onclick = () => {
          const a = document.createElement("a");
          a.href = dataUrl;
          a.download = `${name}.png`;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
        };
      });

      // Close button
      document.getElementById("mfExportCloseBtn").onclick = () => {
        window.close();
      };
    </script>
  </body>
</html>
