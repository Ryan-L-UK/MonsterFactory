<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MonsterFactory Maintenance</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Cinzel:wght@400..900&family=Cormorant+Garamond:ital,wght@0,300..700;1,300..700&family=Merriweather:ital,opsz,wght@0,18..144,300..900;1,18..144,300..900&display=swap");
    </style>

    <style>
      body {
        margin: 0;
        padding: 0;
        background: #0c0c0f;
        color: #e5e2dc;
        font-family: "Segoe UI", sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        overflow: hidden;
      }

      .container {
        text-align: center;
        padding: 40px;
        max-width: 600px;
        border: 1px solid rgba(255, 255, 255, 0.08);
        background: rgba(20, 20, 25, 0.9);

        border-radius: 12px;
        position: relative;
      }

      /* Arcane dieselpunk sigil */
      .sigil {
        width: 120px;
        height: 120px;
        margin: 0 auto 25px auto;
        opacity: 0.9;
        animation: pulse 4s ease-in-out infinite;
      }

      h1 {
        font-size: 1.9rem;
        font-family: "Cinzel Decorative", serif;
        margin-bottom: 10px;
        letter-spacing: 0.5px;
        font-weight: 600;
        color: #f0eef8;
      }

      p {
        font-size: 1.1rem;
        opacity: 0.85;
        line-height: 1.5;
        font-family: "Merriweather", serif;
      }
      img.logo {
        width: 220px;
        opacity: 0.95;
      }
      img.gobby {
        width: 180px;
        opacity: 0.85;
        margin-top: 20px;
      }
      .divider {
        width: 100%;
        height: 2px;
        margin: 15px 0;
        background: linear-gradient(
          to right,
          rgba(214, 174, 74, 0.8) 0%,
          rgba(214, 174, 74, 0.4) 40%,
          rgba(214, 174, 74, 0.15) 70%,
          rgba(214, 174, 74, 0) 100%
        );
      }
    </style>
  </head>

  <body>
    <div class="container">
      <!-- Inline SVG sigil (dieselpunk arcane) -->
      <img
        class="logo"
        src="https://raw.githubusercontent.com/Ryan-L-UK/MonsterFactory-img/refs/heads/main/mf-core-logo.png"
      />
      <h1>Is Undergoing Maintenance</h1>
      <div class="divider"></div>
      <p>
        The arcane engines are cooling, the diesel vents are purging, and the
        workshop is recalibrating its runes.
      </p>
      <p>We'll be back online shortly.</p>
      <img
        class="gobby"
        src="https://raw.githubusercontent.com/Ryan-L-UK/MonsterFactory-img/refs/heads/main/LittleGobbySlots.png"
      />
    </div>
  </body>
</html>
